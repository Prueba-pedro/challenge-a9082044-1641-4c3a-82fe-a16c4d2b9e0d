databaseChangeLog:
  - changeSet:
      id: 1
      author: pragma
      changes:
        - createTable:
            tableName: message
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
              - column:
                  name: sender
                  type: varchar(255)
              - column:
                  name: receiver
                  type: varchar(255)
              - column:
                  name: content
                  type: varchar(255)
              - column:
                  name: timestamp
                  type: datetime